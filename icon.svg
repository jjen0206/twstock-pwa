<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1a2345"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd24a"/>
      <stop offset="100%" stop-color="#ffb020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- K-line bars -->
  <g stroke-linecap="round">
    <line x1="120" y1="300" x2="120" y2="380" stroke="#22c55e" stroke-width="6"/>
    <rect x="108" y="310" width="24" height="50" fill="#22c55e"/>
    <line x1="170" y1="250" x2="170" y2="360" stroke="#ef4444" stroke-width="6"/>
    <rect x="158" y="260" width="24" height="80" fill="#ef4444"/>
    <line x1="220" y1="200" x2="220" y2="340" stroke="#ef4444" stroke-width="6"/>
    <rect x="208" y="220" width="24" height="100" fill="#ef4444"/>
    <line x1="270" y1="170" x2="270" y2="310" stroke="#ef4444" stroke-width="6"/>
    <rect x="258" y="180" width="24" height="110" fill="#ef4444"/>
    <line x1="320" y1="200" x2="320" y2="320" stroke="#22c55e" stroke-width="6"/>
    <rect x="308" y="220" width="24" height="80" fill="#22c55e"/>
    <line x1="370" y1="150" x2="370" y2="280" stroke="#ef4444" stroke-width="6"/>
    <rect x="358" y="170" width="24" height="90" fill="#ef4444"/>
  </g>
  <!-- 獨字 badge -->
  <circle cx="128" cy="130" r="62" fill="url(#gold)"/>
  <text x="128" y="155" text-anchor="middle" font-family="PingFang TC, Microsoft JhengHei, sans-serif" font-size="78" font-weight="900" fill="#1a1200">獨</text>
  <!-- trend arrow -->
  <path d="M 100 420 L 200 360 L 280 390 L 420 280" stroke="url(#gold)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="420,280 400,295 415,305" fill="#ffd24a"/>
</svg>
